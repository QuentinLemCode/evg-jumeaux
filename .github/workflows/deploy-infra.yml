name: Deploy infra

# Creates or updates the GCP VM that hosts the app and the agents.
# The app itself is deployed by scripts/agent/deploy.sh on the VM — this
# workflow only owns the machine it runs on.

on:
  workflow_dispatch:
    inputs:
      refresh_agents:
        description: 'Pull main on the agents VM and restart the Hermes gateway'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the repository path for GHCR
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=evg-jumeaux/infra"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_tailscale_authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

          # --- Cloudflare: DNS + ingress -----------------------------------
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_domain: ${{ secrets.DOMAIN }}
          TF_VAR_site_subdomain: ${{ vars.SITE_SUBDOMAIN }}
          TF_VAR_ingress_mode: ${{ vars.INGRESS_MODE }}

          # --- Agent Platform key, shared by Hermes and the OpenCode agents -
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_llm_provider: ${{ vars.LLM_PROVIDER }}
          TF_VAR_agents_service_account: ${{ vars.AGENTS_SERVICE_ACCOUNT }}
          TF_VAR_llm_base_url: ${{ vars.LLM_BASE_URL }}
          TF_VAR_llm_model: ${{ vars.LLM_MODEL }}

          # --- messaging and alerts ----------------------------------------
          TF_VAR_discord_bot_token: ${{ secrets.DISCORD_BOT_TOKEN }}
          TF_VAR_discord_allowed_users: ${{ secrets.DISCORD_ALLOWED_USERS }}
          TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_telegram_allowed_users: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          TF_VAR_telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

          # --- GitHub: the code agent opens pull requests -------------------
          TF_VAR_github_token: ${{ secrets.AGENT_GITHUB_TOKEN }}

          # --- the app -----------------------------------------------------
          TF_VAR_site_repo_url: ${{ vars.SITE_REPO_URL }}
          TF_VAR_auth_secret: ${{ secrets.AUTH_SECRET }}
          TF_VAR_seed_pin_hashes: ${{ secrets.SEED_PIN_HASHES }}
          TF_VAR_vapid_public_key: ${{ secrets.VAPID_PUBLIC_KEY }}
          TF_VAR_vapid_private_key: ${{ secrets.VAPID_PRIVATE_KEY }}
          TF_VAR_vapid_subject: ${{ vars.VAPID_SUBJECT }}
          # GHCR rejects an uppercase path, and GitHub org names often have one.
          TF_VAR_image_repository: ghcr.io/${{ env.REPO_LOWER }}
          TF_VAR_image_tag: ${{ vars.IMAGE_TAG || 'main' }}
          TF_VAR_ghcr_username: ${{ github.repository_owner }}
          TF_VAR_ghcr_token: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Outputs
        run: terraform output

      - name: What to do next
        run: |
          {
            echo '### Infra déployée'
            echo ''
            echo "| | |"
            echo "|---|---|"
            echo "| Site | $(terraform output -raw site_url) |"
            echo "| Santé | $(terraform output -raw health_url) |"
            echo "| Ingress | $(terraform output -raw ingress_mode) |"
            echo ''
            echo '**Deux VM.** Les agents ne partagent plus le CPU de'
            echo "l'application, donc un build d'agent ne se voit plus sur le"
            echo 'temps de réponse du site.'
            echo ''
            echo '```'
            terraform output -json app_vm    | jq -r '"app    : \(.name) (\(.machine_type))  →  \(.ssh)"'
            terraform output -json agents_vm | jq -r '"agents : \(.name) (\(.machine_type))  →  \(.ssh)"'
            echo '```'
            echo ''
            echo 'Reporte ces **Variables** dans le dépôt :'
            echo ''
            echo '```'
            terraform output -json github_variables_to_set | jq -r 'to_entries[] | "\(.key)=\(.value)"'
            echo '```'
            echo ''
            echo 'Le DNS Cloudflare est déjà à jour. Le premier déploiement se'
            echo 'fait tout seul au boot ; les suivants passent par le workflow'
            echo '*Deploy* sur `main`.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Terraform rewrites the VM's .env and its systemd units, but only a BOOT
  # applies them: `metadata_startup_script` does not re-run on a metadata
  # change. So a config change used to need a manual ssh, and the gateway
  # kept running yesterday's code and yesterday's environment.
  refresh-agents:
    name: Refresh the agents VM
    needs: terraform
    if: inputs.refresh_agents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Check the runner actually joined
        run: |
          # The join step above exits 0 even when it failed — see deploy.yml.
          STATE="$(tailscale status --json | jq -r '.BackendState // "unknown"')"
          if [ "$STATE" != "Running" ]; then
            echo "::error::This runner is not on the tailnet (BackendState=$STATE)."
            tailscale status || true
            exit 1
          fi

      - name: Pull main and restart the gateway
        env:
          HOST: ${{ vars.AGENTS_VM_HOSTNAME || 'evg-site-agent' }}
          RUNTIME: ${{ vars.LLM_PROVIDER || 'antigravity' }}
          MODEL: ${{ vars.LLM_MODEL || 'gemini-3.8-flash' }}
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Piped over stdin, not quoted onto the ssh command line: nesting
          # quotes through two shells is how a working script quietly becomes a
          # no-op, and there is no way to tell by reading it.
          # The two values the remote script needs, written as literal
          # assignments so the body below stays a QUOTED heredoc. Nesting
          # quotes through two shells is what the note above warns about.
          {
            printf 'RUNTIME=%q\n' "$RUNTIME"
            printf 'MODEL=%q\n' "$MODEL"
            printf 'KEY=%q\n' "$KEY"
          } > /tmp/refresh-agents.sh
          cat >> /tmp/refresh-agents.sh <<'REMOTE'
          set -euo pipefail
          cd ~/site
          BEFORE="$(git rev-parse HEAD)"
          git fetch --quiet origin main
          git reset --hard --quiet origin/main
          AFTER="$(git rev-parse HEAD)"
          echo "checkout: ${BEFORE:0:7} -> ${AFTER:0:7}"

          # npm ci only when the lockfile actually moved: it takes minutes on an
          # e2-medium and most configuration changes touch no dependency.
          if git diff --quiet "$BEFORE" "$AFTER" -- package-lock.json; then
            echo "lockfile unchanged, skipping npm ci"
          else
            echo "lockfile changed, reinstalling"
            npm ci
          fi

          # Reconcile the two lines that choose a runtime.
          #
          # The .env is written by the startup script, which runs ONLY at boot.
          # So a VM booted before the switch to Antigravity kept
          # AGENT_RUNTIME=opencode for as long as it stayed up, and every agent
          # ran on the wrong runtime while the repository said otherwise. That
          # is not a stale cache, it is a second source of truth, and this step
          # exists to collapse it without a shell prompt.
          #
          # The API key is reconciled too, and the first version of this step
          # deliberately did NOT do that, on the grounds that "the key is
          # already on the VM". True, and useless: the key already on the VM
          # was written at the last BOOT, which was four days before the one
          # that works existed. agy failed with API_KEY_SERVICE_BLOCKED on
          # generativelanguage.googleapis.com and nothing said why.
          #
          # It is passed as a literal assignment into a file, never on a
          # command line and never echoed, and Actions masks it in logs. The
          # alternative was a key that can only be rotated by rebooting a VM.
          env_set() {
            local key="$1" value="$2" f=~/.hermes/.env
            # EVERY occurrence, not the first: a hand-appended duplicate makes
            # the file's last line win, which is not the line anyone read.
            #
            # `grep -v` into a temp file and `cat` it back, rather than
            # `sed -i`: `cat >` keeps the inode and the 0600 mode, and the
            # whole thing is testable on a machine whose sed is not GNU's —
            # deploy.sh learned the same lesson the expensive way. `|| true`
            # because grep exits 1 when it filters everything out.
            grep -v "^$key=" "$f" > "$f.next" || true
            printf '%s=%s\n' "$key" "$value" >> "$f.next"
            cat "$f.next" > "$f" && rm -f "$f.next"
            echo "  .env: $key=$value"
          }
          env_set AGENT_RUNTIME "$RUNTIME"
          env_set AGENT_MODEL "$MODEL"
          # Never echoed by env_set: it prints the key NAME and the value, so
          # the secret gets its own silent path.
          grep -v '^GEMINI_API_KEY=' ~/.hermes/.env > ~/.hermes/.env.next || true
          printf 'GEMINI_API_KEY=%s\n' "$KEY" >> ~/.hermes/.env.next
          cat ~/.hermes/.env.next > ~/.hermes/.env && rm -f ~/.hermes/.env.next
          echo "  .env: GEMINI_API_KEY set from the repository secret"

          # Keep the runtime current. `agy` has no self-update, and its
          # installer is idempotent, so re-running it IS the upgrade. OpenCode
          # is the standby runtime and follows along.
          export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
          curl -fsSL https://antigravity.google/cli/install.sh | bash 2>&1 | tail -2 \
            || echo "agy install failed, continuing with the version already there"
          echo "agy: $(agy --version 2>&1 | head -1)"
          opencode upgrade 2>&1 | tail -1 || echo "opencode upgrade failed, continuing"

          sudo systemctl restart hermes-gateway
          REMOTE
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "hermes@${HOST}" 'bash -s' < /tmp/refresh-agents.sh

      - name: Prove it came back
        env:
          HOST: ${{ vars.AGENTS_VM_HOSTNAME || 'evg-site-agent' }}
        run: |
          # A restart that exits 0 and then crash-loops looks identical to a
          # good one for about five seconds.
          sleep 12
          if ! ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "hermes@${HOST}" 'systemctl is-active hermes-gateway'; then
            echo "::error::the gateway is not active after the restart"
            ssh "hermes@${HOST}" 'journalctl -u hermes-gateway -n 25 --no-pager -o cat' || true
            exit 1
          fi
          ssh "hermes@${HOST}" 'journalctl -u hermes-gateway -n 5 --no-pager -o cat'
      - name: Prove the agent runtime answers
        env:
          HOST: ${{ vars.AGENTS_VM_HOSTNAME || 'evg-site-agent' }}
        run: |
          # A gateway that is `active` proves only that Node started. Whether
          # the runtime behind it can reach a model is a separate question,
          # and the answer was NO for four days with nothing going red: the
          # VM carried an API key from an earlier boot, restricted to
          # aiplatform.googleapis.com by a Google-managed policy, while agy
          # calls generativelanguage.googleapis.com. Every request failed at
          # the moment a human asked for something — the worst moment to find
          # out.
          #
          # So: one trivial call, in an empty directory so an agent running in
          # accept-edits mode has nothing to touch, and a red job when it
          # fails.
          cat > /tmp/prove-runtime.sh <<'REMOTE'
          set -uo pipefail
          export PATH="$HOME/.local/bin:$HOME/.opencode/bin:$PATH"
          # `set -a`: a .env holds plain assignments, so sourcing it without
          # this makes shell variables that no child process ever sees.
          set -a; . ~/.hermes/.env; set +a
          D="$(mktemp -d)"; cd "$D"
          # The prompt is ATTACHED to --print. The flag takes an optional
          # value, so `--print --model x 'prompt'` makes agy read "--model" as
          # the prompt and ignore the real one, with exit code 2.
          OUT="$(timeout 150 agy \
            --print='Answer with exactly one word: READY' \
            --model "${AGENT_MODEL:-gemini-3.8-flash}" \
            --effort low \
            --output-format text \
            --print-timeout 0 \
            --dangerously-skip-permissions 2>&1 | tail -5)"
          cd /; rm -rf "$D"
          printf '%s\n' "$OUT"
          printf '%s' "$OUT" | grep -qi 'ready' || exit 1
          REMOTE
          if ! ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "hermes@${HOST}" 'bash -s' < /tmp/prove-runtime.sh; then
            echo "::error::the agents VM cannot reach the model. No agent can run."
            echo "::error::A key created in THIS GCP project cannot work: a Google-managed"
            echo "::error::policy restricts its keys to aiplatform.googleapis.com, while agy"
            echo "::error::calls generativelanguage.googleapis.com. Use an AI Studio key as"
            echo "::error::the GEMINI_API_KEY secret."
            exit 1
          fi
