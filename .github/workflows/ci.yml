name: CI

# The gate, sized to what actually changed.
#
# A spec-driven repository gets a lot of specs-only and docs-only changes, and
# paying for a browser download plus a production build on each of them is how
# an Actions bill gets out of hand. So:
#
#   every change      → quick  (one npm ci: types, lint, design, migrations,
#                               spec hygiene, schema drift)
#   code changed      → tests  (unit + integration + build)
#                     → e2e    (Playwright, browser cached)
#   terraform changed → infra  (fmt + validate)
#
# TWO required checks now: `Verdict` and `Guarded paths`.
#
# Not one, and the reason is subtle. Adding the `infra-ok` label has to be able
# to unblock a pull request, so the guard must re-run on a label event. But if
# VERDICT also re-ran then, it would judge a run in which every heavy job was
# skipped — and skipped counts as passed — so labelling a pull request whose
# tests had FAILED would report success and overwrite the failure. Verdict
# therefore does not run on a label event at all, keeps whatever it concluded
# about the code, and the guard answers for itself.
#
# `Verdict` is the ONE job that judges the code. It passes when
# nothing failed, skipped included — which is what lets auto-merge work on a
# PR where the heavy jobs were legitimately skipped. Requiring the heavy jobs
# directly would wedge auto-merge forever on a docs-only PR.

on:
  pull_request:
    # `labeled` matters: the guarded-paths check below is unlocked by a label,
    # and without this event the unlock would never be re-evaluated.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_e2e:
        description: 'Set to "true" when the same tree already passed E2E on its PR.'
        required: false
        type: string
        default: 'false'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Never a real secret: the build issues no session and the tests do not
  # verify one. A literal keeps the gate runnable on a fork.
  AUTH_SECRET: ci-secret-that-is-at-least-32-characters

jobs:
  scope:
    name: What changed
    # Nothing downstream of it runs on a label event either.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.classify.outputs.code }}
      terraform: ${{ steps.classify.outputs.terraform }}
      summary: ${{ steps.classify.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: classify
        run: |
          case "${{ github.event_name }}" in
            pull_request) BASE="${{ github.event.pull_request.base.sha }}" ;;
            push)         BASE="${{ github.event.before }}" ;;
            *)            BASE="" ;;
          esac

          # No usable base (a dispatch, a first push, a force push): assume
          # everything changed. Erring towards running the suite is the right
          # way to be wrong here.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base — treating everything as changed"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            echo "summary=full (no diff base)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          echo "changed files:"; echo "$FILES" | sed 's/^/  /'

          # `scripts/` and the config files count as code: they are what the
          # gate itself runs.
          if echo "$FILES" | grep -qE '^(src/|e2e/|scripts/|public/|package(-lock)?\.json|tsconfig\.json|next\.config\.mjs|playwright\.config\.ts|vitest.*\.ts|postcss\.config\.mjs|drizzle\.config\.ts|Dockerfile|docker-compose.*\.yml|Caddyfile|caddy/|\.nvmrc)'; then
            CODE=true
          else
            CODE=false
          fi
          if echo "$FILES" | grep -qE '^terraform/'; then TF=true; else TF=false; fi

          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "terraform=$TF" >> "$GITHUB_OUTPUT"
          echo "summary=code=$CODE terraform=$TF" >> "$GITHUB_OUTPUT"

  # Everything below is skipped when the event is just a label being added or
  # removed: the only thing a label can change is the guard's answer, and
  # re-running the browser suite to learn that costs four minutes for nothing.
  quick:
    name: Quick checks
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of truth for the runtime, so CI and a
          # developer's shell cannot drift apart.
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      # All of these are seconds each, and they used to sit in three separate
      # jobs paying three separate `npm ci`. One job, one install.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Design system
        run: npm run lint:design

      - name: Migrations survive a blue/green deploy
        run: npm run lint:migrations

      - name: Every spec has an end-to-end test
        run: npm run lint:e2e-coverage

      - name: Schema matches the generated migrations
        run: |
          before=$(ls -1 src/db/migrations/*.sql 2>/dev/null | wc -l)
          npx drizzle-kit generate --name ci-drift-check
          after=$(ls -1 src/db/migrations/*.sql 2>/dev/null | wc -l)
          if [ "$before" != "$after" ]; then
            echo "::error::src/db/schema.ts has changes with no generated migration."
            echo "Run: npm run db:generate"
            exit 1
          fi
          echo "schema and migrations are in sync"

      - name: Spec hygiene
        run: |
          missing=0
          for spec in specs/[0-9][0-9][0-9][0-9]-*.md; do
            name="$(basename "$spec")"
            grep -q "$name" specs/README.md || {
              echo "::error file=specs/README.md::$name is not on the status board"; missing=1; }
            grep -q '^## Acceptance criteria' "$spec" || {
              echo "::error file=$spec::no '## Acceptance criteria' section"; missing=1; }
          done
          # The one rule agents break most often (AGENTS.md §5): French prose
          # creeping into documentation that is meant to be English.
          if grep -rlniE '\b(nous devons|il faut que|c.est pourquoi|ainsi que)\b' \
               --include='*.md' specs docs AGENTS.md 2>/dev/null; then
            echo "::error::markdown must be written in English"; missing=1
          fi
          exit $missing

  tests:
    name: Tests and build
    needs: [scope]
    if: needs.scope.outputs.code == 'true' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # Runs here and never on a developer's machine: it boots a real SQLite
      # database and applies the migrations (AGENTS.md §4).
      - name: Integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end
    needs: [scope]
    if: needs.scope.outputs.code == 'true' && inputs.skip_e2e != 'true' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Read the Playwright version
        id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # A browser download is ~120 MB and takes a minute; caching it keyed on
      # the Playwright version turns that into a few seconds.
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install the browser
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" = "true" ]; then
            # The binary is cached; only the shared libraries need apt.
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Build
        run: npm run build

      - name: Run the end-to-end suite
        run: npm run e2e

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            .e2e/results/
          retention-days: 7

  infra:
    name: Terraform
    needs: [scope]
    if: needs.scope.outputs.terraform == 'true' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: Format
        run: terraform fmt -check -recursive

      # Validates without a backend or credentials, so it runs on a PR. This is
      # where a provider resource renamed between majors surfaces — at review
      # time instead of at apply time.
      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate

  # The agent may now propose changes to the machinery (scripts/agent/fix.sh).
  # These are the files that define what it is allowed to do, so a human says
  # yes to them — otherwise an agent could weaken the very gate that is about
  # to judge its own pull request, and auto-merge would honour the weakened
  # one.
  guarded:
    name: Guarded paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a human for infrastructure, workflows and agent tooling
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "${BASE}" ]; then
            echo "not a pull request; nothing to guard"
            exit 0
          fi

          CHANGED="$(git diff --name-only "${BASE}" "${HEAD}" \
            -- '.github/workflows/**' 'terraform/**' 'scripts/agent/**' \
               '.opencode/**' 'skills/**' 'AGENTS.md' || true)"

          if [ -z "$CHANGED" ]; then
            echo "no guarded path touched"
            exit 0
          fi

          echo "guarded paths in this PR:"
          echo "$CHANGED" | sed 's/^/  /'

          case ",${LABELS}," in
            *,infra-ok,*)
              echo "infra-ok is present — a human said yes"
              exit 0
              ;;
          esac

          echo "::error::This pull request changes the machinery that decides what the agent may do."
          echo "::error::A human has to say yes: add the 'infra-ok' label, and this check will re-run."
          echo "::error::Touched: $(echo "$CHANGED" | tr '\n' ' ')"
          exit 1

  verdict:
    name: Verdict
    # The single check branch protection requires. `always()` so it reports
    # even when a needed job was skipped — a skipped job is a pass here, which
    # is exactly what makes auto-merge work on a docs-only PR.
    if: always() && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    needs: [scope, quick, tests, e2e, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Assert nothing failed
        run: |
          declare -A results=(
            [scope]="${{ needs.scope.result }}"
            [quick]="${{ needs.quick.result }}"
            [tests]="${{ needs.tests.result }}"
            [e2e]="${{ needs.e2e.result }}"
            [infra]="${{ needs.infra.result }}"
            # Listing a job in `needs` is not the same as judging it:
            # without this line Verdict passed while Guarded paths
            # failed — a required check saying yes to the one pull
            # request the guard exists to stop.
            [guarded]="${{ needs.guarded.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            printf '  %-10s %s\n' "$job" "${results[$job]}"
            case "${results[$job]}" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          echo
          echo "scope: ${{ needs.scope.outputs.summary }}"
          if [ "$failed" -ne 0 ]; then
            echo "::error::a required job did not pass"
            exit 1
          fi
          echo "all green"
