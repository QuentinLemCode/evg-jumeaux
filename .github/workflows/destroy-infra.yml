name: Destroy infra

# Destroys the VM. The SQLite database lives on the VM's boot disk, so this
# DELETES EVERY RESULT PLAYERS ENTERED. Back it up first:
#
#   tailscale ssh hermes@evg-site-agent
#   sqlite3 ~/site/data/evg.db ".backup '/tmp/evg-final.db'"
#
# then copy it off the machine.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "destroy" to confirm — this deletes the database'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "destroy" ]; then
            echo "::error::confirmation must be exactly 'destroy'"
            exit 1
          fi

  terraform:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=evg-jumeaux/infra"

      - name: Terraform destroy
        run: terraform destroy -auto-approve -input=false
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_tailscale_authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          TF_VAR_llm_api_key: ${{ secrets.LLM_API_KEY }}
          TF_VAR_auth_secret: ${{ secrets.AUTH_SECRET }}
