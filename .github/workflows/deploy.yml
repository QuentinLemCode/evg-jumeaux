name: Deploy

# main → gate → build image → push to GHCR → zero-downtime deploy → verify.
#
# Nothing is built on the VM: the image is built here once and pulled there.
# The deploy itself is blue/green behind a graceful Caddy reload, so a release
# drops no connection and a failed release changes nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Redeploy an existing tag (e.g. sha-a1b2c3d). Empty = build HEAD.'
        required: false
        type: string

# One deploy at a time: two concurrent runs would fight over which colour is
# live. Never cancel one in flight — a half-switched stack is worse than a
# queued release.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    if: inputs.image_tag == ''
    uses: ./.github/workflows/ci.yml
    with:
      # The tree being merged is the tree that just passed E2E on its pull
      # request (branch protection requires the branch to be up to date), and
      # the image is smoke-tested below. Re-running 52 browser tests on the
      # same code doubles the bill and proves nothing new.
      skip_e2e: 'true'

  build:
    name: Build and push image
    needs: [gate]
    if: always() && (needs.gate.result == 'success' || inputs.image_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag to deploy
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "commit=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.meta.outputs.skip_build == 'false'

      - uses: docker/login-action@v3
        if: steps.meta.outputs.skip_build == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.meta.outputs.skip_build == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo }}:main
          # Registry cache, so a deploy that only changes src/ does not rebuild
          # node_modules and recompile better-sqlite3 from scratch.
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.repo }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.meta.outputs.repo }}:buildcache,mode=max
          provenance: false

      - name: Smoke-test the image before it goes near production
        if: steps.meta.outputs.skip_build == 'false'
        run: |
          IMAGE="ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}"
          mkdir -p /tmp/smoke
          # The image runs as `node` (uid 1000) and a bind mount SHADOWS the
          # image's own ownership, taking the host directory's instead. The
          # runner's user is uid 1001, so without this the very first thing the
          # container does is fail to create the database.
          sudo chown 1000:1000 /tmp/smoke
          # Migrations must run in the image that will serve them.
          docker run --rm -e AUTH_SECRET=smoke-secret-at-least-32-characters-ok \
            -v /tmp/smoke:/app/data "$IMAGE" npm run --silent db:migrate
          CID=$(docker run -d -p 3000:3000 \
            -e AUTH_SECRET=smoke-secret-at-least-32-characters-ok \
            -e GIT_COMMIT=${{ steps.meta.outputs.commit }} \
            -v /tmp/smoke:/app/data "$IMAGE")
          for _ in $(seq 1 20); do
            BODY=$(curl -fsS --max-time 3 http://localhost:3000/api/health 2>/dev/null || true)
            if echo "$BODY" | grep -q '"status":"ok"'; then
              echo "image is healthy: $BODY"
              # It must also report the commit it was built for, or the deploy
              # verification downstream is meaningless.
              echo "$BODY" | grep -q "${{ steps.meta.outputs.commit }}" \
                || { echo "::error::/api/health does not report GIT_COMMIT"; exit 1; }
              docker rm -f "$CID" >/dev/null
              exit 0
            fi
            sleep 3
          done
          echo "::error::the image never became healthy"
          docker logs "$CID" | tail -40
          docker rm -f "$CID" >/dev/null
          exit 1

  deploy:
    name: Deploy to production
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      # The VM has no inbound ports in tunnel mode, so the runner joins the
      # tailnet instead of the VM opening one.
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          # TWO ways in, and the first one that is set wins.
          #
          # A tagged auth key is the simple one: created in the admin console
          # with tag:ci applied to it, nothing to get wrong at runtime. It
          # expires (90 days at most), which is the price.
          #
          # OAuth mints that key per run and never expires, but it fails with
          #   403 "calling actor does not have enough permissions"
          # unless the client carries tag:ci — and the console only offers that
          # tag if it already exists in tagOwners when the client is created.
          # A client made before the tag existed cannot be fixed; tags are not
          # editable afterwards, it has to be recreated.
          authkey: ${{ secrets.TAILSCALE_CI_AUTHKEY }}
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # The hostname lives in two places that have to agree — Terraform's
      # `app_instance_name` and this variable — and nothing checked. A
      # mismatch surfaced as `ssh: Could not resolve hostname`, which reads
      # like a network fault rather than a configuration one. So: default to
      # the Terraform default, and if it is still not there, say which
      # machines ARE.
      - name: Resolve the application VM on the tailnet
        id: host
        env:
          HOST: ${{ vars.APP_VM_HOSTNAME || 'evg-app' }}
        run: |
          # The join step above exits 0 EVEN WHEN IT FAILED: its retry loop
          # ends without propagating the failure, so five 403s in a row still
          # report success. Check the backend state before anything else, or
          # every problem downstream looks like an ACL problem.
          STATE="$(tailscale status --json | jq -r '.BackendState // "unknown"')"
          if [ "$STATE" != "Running" ]; then
            echo "::error::This runner is not on the tailnet (BackendState=$STATE). The join step failed and reported success anyway."
            echo "::error::Scroll up to 'Connect to Tailscale' for the real reason."
            echo "::error::A 403 'calling actor does not have enough permissions' means the OAuth client may not mint keys for tag:ci. The console only offers that tag if it exists in tagOwners BEFORE the client is created, and a client cannot be re-tagged afterwards."
            echo "::error::The shortcut: create a reusable auth key with tag:ci applied and put it in the TAILSCALE_CI_AUTHKEY secret. It takes precedence over OAuth."
            tailscale status || true
            exit 1
          fi

          # The netmap arrives a moment after the join, so retry before
          # concluding anything.
          for _ in $(seq 1 10); do
            PEERS=$(tailscale status --json | jq -r '.Peer[]?.HostName' | sort | tr '\n' ' ')
            if echo " $PEERS " | grep -q " ${HOST} "; then
              echo "host=${HOST}" >> "$GITHUB_OUTPUT"
              echo "deploying to ${HOST}"
              exit 0
            fi
            sleep 3
          done

          echo "::error::'${HOST}' is not visible on this tailnet. Peers: ${PEERS:-(none)}"
          if [ -z "${PEERS// /}" ]; then
            # No peers at all is an ACL answer, not a naming one: tag:ci can
            # only see what an acls rule lets it reach. The usual cause is the
            # VM not actually carrying tag:evg-app — `--advertise-tags` on an
            # already-authenticated node only REQUESTS the tag and needs a
            # reauthentication to take effect. Check on the VM with:
            #     tailscale status --json | jq .Self.Tags
            echo "::error::No peers visible at all. Either no acls rule grants tag:ci access, or the app VM does not actually carry tag:evg-app (advertise-tags needs a reauth to take effect)."
          else
            echo "::error::Set APP_VM_HOSTNAME to one of the machines listed above."
          fi
          echo '--- tailscale status ---'
          tailscale status || true
          exit 1

      - name: Deploy
        env:
          # The APPLICATION VM. The agents live on a separate one and are
          # deliberately not involved in a deploy.
          HOST: ${{ steps.host.outputs.host }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          # The VM checkout supplies the deploy SCRIPTS and the compose files;
          # the application itself comes from the image. Resetting to main is
          # therefore deliberate even when redeploying an older tag: we want
          # the current deploy logic, not the logic that shipped with that tag.
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "hermes@${HOST}" \
            "cd ~/site && git fetch --quiet origin main && git reset --hard --quiet origin/main && scripts/agent/deploy.sh --tag '${TAG}' --commit '${COMMIT}'"

      - name: Verify the public endpoint
        env:
          COMMIT: ${{ needs.build.outputs.commit }}
          # Composed from the secret so the domain is masked in the logs.
          FQDN: ${{ vars.SITE_SUBDOMAIN || 'evg' }}.${{ secrets.DOMAIN }}
        run: |
          URL="https://${FQDN}/api/health"
          for _ in $(seq 1 15); do
            BODY=$(curl -fsS --max-time 5 "$URL" 2>/dev/null || true)
            if echo "$BODY" | grep -q '"status":"ok"' && echo "$BODY" | grep -q "${COMMIT}"; then
              echo "live: $BODY"
              exit 0
            fi
            sleep 4
          done
          echo "::error::${URL} does not report the deployed commit"
          echo "last response: ${BODY:-none}"
          exit 1

      - name: Tell me if the deploy failed
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Guarded in bash, not in `if:` — the `secrets` context is not
          # available in a step condition.
          [ -n "$WEBHOOK" ] || { echo "no webhook configured"; exit 0; }
          # The VM watcher covers runtime failures; this covers the deploy
          # itself, which the VM cannot report on because it never happened.
          curl -fsS -H 'Content-Type: application/json' -X POST "$WEBHOOK" \
            -d "$(printf '{"username":"Hermes","content":"🔴 Déploiement EVG échoué sur %s\\nLe site tourne toujours sur la version précédente.\\n%s"}' \
                  "${{ needs.build.outputs.tag }}" \
                  "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")" || true
