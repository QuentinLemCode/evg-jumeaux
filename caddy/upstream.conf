# The live colour. Rewritten by scripts/agent/deploy.sh and applied with a
# graceful `caddy reload`, so requests in flight are never dropped.
#
# The health check is a safety net, not the switch: the switch is the reload.
reverse_proxy app-blue:3000 {
	health_uri /api/health
	health_interval 5s
	health_timeout 3s
	fail_duration 10s
}
