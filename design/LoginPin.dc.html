<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;700;900&family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #ff5d5d; text-decoration: none; }
    a:hover { color: #e13c3c; }

    .cf-root {
      width: 390px; height: 844px; overflow: hidden; position: relative;
      font-family: 'Instrument Sans', system-ui, sans-serif;
      display: flex; flex-direction: column;
    }
    .cf-display { font-family: 'Gabarito', system-ui, sans-serif; }
    .cf-sticker { border: 3px solid #1d1a17; border-radius: 20px; background: #fff;
      box-shadow: 3px 4px 0 #1d1a17; }
    .cf-avatar { display: flex; align-items: center; justify-content: center;
      border-radius: 999px; border: 3px solid #1d1a17; background: #fff8ee; }
    .cf-mark { display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border: 2px solid #1d1a17; border-radius: 11px; }
    .cf-mark svg { width: 19px; height: 19px; }
    .cf-btn { width: 100%; min-height: 52px; border: 3px solid #1d1a17; border-radius: 18px;
      font-family: 'Gabarito', system-ui, sans-serif; font-size: 17px; font-weight: 900;
      letter-spacing: .01em; box-shadow: 3px 5px 0 #1d1a17; }
    .cf-rise { animation: cf-rise .42s cubic-bezier(.22,.9,.3,1) both; }
    @keyframes cf-rise {
      from { transform: translateY(16px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    .cf-pop { animation: cf-pop .5s cubic-bezier(.2,1.5,.4,1) both; }
    @keyframes cf-pop {
      from { transform: scale(.72) translateY(16px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }
  </style>
</helmet>

<div class="cf-root" style="background: #fff8ee; color: #1d1a17; justify-content: center; padding: 0 20px">

  <p class="cf-display" style="margin: 0 0 16px; text-align: center; font-size: 24px; line-height: 1.08; font-weight: 900; letter-spacing: -.02em">Ton code</p>

  <button class="cf-sticker" style="display: flex; align-items: center; gap: 11px; padding: 8px 13px; margin-bottom: 20px; text-align: left; font: inherit; color: inherit">
    <span class="cf-avatar" style="width: 40px; height: 40px; font-size: 21px; border-color: #7b5cff">🧠</span>
    <span class="cf-display" style="flex: 1; font-size: 17px; font-weight: 700">Quentin</span>
    <span style="font-size: 13px; font-weight: 600; color: #7b5cff">Changer</span>
  </button>

  <!-- Four filled dots: the keypad submits on the sixth digit, so the dots are
       the only progress indicator the screen needs. -->
  <div style="display: flex; justify-content: center; gap: 11px; margin-bottom: 26px">
    <span style="width: 15px; height: 15px; border-radius: 999px; background: #7b5cff"></span>
    <span style="width: 15px; height: 15px; border-radius: 999px; background: #7b5cff"></span>
    <span style="width: 15px; height: 15px; border-radius: 999px; background: #7b5cff"></span>
    <span style="width: 15px; height: 15px; border-radius: 999px; background: #7b5cff"></span>
    <span style="width: 15px; height: 15px; border-radius: 999px; background: #e3d8c8"></span>
    <span style="width: 15px; height: 15px; border-radius: 999px; background: #e3d8c8"></span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px">
    <button class="cf-sticker cf-display cf-pop" style="min-height: 62px; font-size: 25px; font-weight: 700; color: inherit; animation-delay: 0s">1</button>
    <button class="cf-sticker cf-display cf-pop" style="min-height: 62px; font-size: 25px; font-weight: 700; color: inherit; animation-delay: .03s">2</button>
    <button class="cf-sticker cf-display cf-pop" style="min-height: 62px; font-size: 25px; font-weight: 700; color: inherit; animation-delay: .06s">3</button>
    <button class="cf-sticker cf-display cf-pop" style="min-height: 62px; font-size: 25px; font-weight: 700; color: inherit; animation-delay: .09s">4</button>
    <button class="cf-sticker cf-display cf-pop" style="min-height: 62px; font-size: 25px; font-weight: 700; color: inherit; animation-delay: .12s">5</button>
    <button class="cf-sticker cf-display cf-pop" style="min-height: 62px; font-size: 25px; font-weight: 700; color: inherit; animation-delay: .15s">6</button>
    <button class="cf-sticker cf-display cf-pop" style="min-height: 62px; font-size: 25px; font-weight: 700; color: inherit; animation-delay: .18s">7</button>
    <button class="cf-sticker cf-display cf-pop" style="min-height: 62px; font-size: 25px; font-weight: 700; color: inherit; animation-delay: .21s">8</button>
    <button class="cf-sticker cf-display cf-pop" style="min-height: 62px; font-size: 25px; font-weight: 700; color: inherit; animation-delay: .24s">9</button>
    <button class="cf-pop" style="min-height: 62px; border: 0; background: none; font-family: inherit; font-size: 14px; font-weight: 600; color: #6f6357; animation-delay: .27s">Effacer</button>
    <button class="cf-sticker cf-display cf-pop" style="min-height: 62px; font-size: 25px; font-weight: 700; color: inherit; animation-delay: .3s">0</button>
    <button class="cf-pop" style="min-height: 62px; border: 0; background: none; font-size: 21px; color: #6f6357; animation-delay: .33s" aria-label="Supprimer le dernier chiffre">⌫</button>
  </div>

  <p style="margin: 22px 0 0; text-align: center; font-size: 12px; line-height: 1.4; color: #a3988a">
    Ça part tout seul au 6ᵉ chiffre.
  </p>
</div>
</x-dc>
</body>
</html>
